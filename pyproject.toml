[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polisher"
version = "0.1.0"
description = "Select text anywhere, press a hotkey, and let an LLM polish, rephrase or find synonyms for it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pynput>=1.7.6",
  "pyperclip>=1.8.2",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
polisher = "polisher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
polisher = ["config.example.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
